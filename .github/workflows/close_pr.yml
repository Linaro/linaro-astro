name: Close Pull Request

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  statuses: write
  pull-requests: write
  id-token: write

concurrency:
  group: cleanup-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: self-hosted
    steps:
      - name: Fetch git repository
        uses: actions/checkout@v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.15.0"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::691071635361:role/github-actions-oidc-role
          aws-region: us-east-1

      - name: Remove SST Stage
        run: |
          # Only attempt removal if the stage actually exists. If the deploy
          # workflow never ran (e.g. build failed, or PR closed before deploy),
          # there's nothing to tear down.
          if npx sst unlock --stage pr-${{ github.event.number }} 2>/dev/null; then
            echo "Stage exists, removing..."
            npx sst remove --stage pr-${{ github.event.number }}
          else
            echo "No stage found for pr-${{ github.event.number }}, nothing to clean up."
          fi
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.PUBLIC_CLOUDINARY_CLOUD_NAME }}
          PUBLIC_FRIENDLY_CAPTCHA_SITEKEY: ${{ vars.FRIENDLY_CAPTCHA_SITEKEY }}
          FRIENDLY_CAPTCHA_API_KEY: ${{ secrets.FRIENDLY_CAPTCHA_API_KEY }}
          CUSTOM_DOMAIN: "linaro-astro-pr-${{ github.event.number }}.ghactions.linaro.org"
